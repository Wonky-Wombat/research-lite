name: CI (ruff + mypy, py3.12)

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements_dev.txt

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml', 'mypy.ini', '**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-3.12-

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (type checking)
        run: |
          mypy knowledge_lite tests